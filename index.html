<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wahed Shariah Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --yellow: #F5C400;
    --yellow-light: #FFFBE6;
    --yellow-dark: #C49A00;
    --grey: #A8A8A8;
    --grey-dark: #4A4A4A;
    --grey-light: #F5F5F5;
    --white: #FFFFFF;
    --border: #E8E8E8;
    --text: #222222;
    --text-muted: #888888;
    --bg: #F9F9F9;
    --radius: 14px;
    --shadow: 0 2px 16px rgba(0,0,0,0.06);
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 0 28px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-logo {
    height: 28px;
    display: block;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .header-label {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .badge {
    background: var(--yellow-light);
    color: var(--yellow-dark);
    font-size: 11px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid #F0D060;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  .chat-wrapper {
    width: 100%;
    max-width: 740px;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 28px 16px 0;
  }

  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding-bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    min-height: calc(100vh - 64px - 130px);
  }

  .welcome {
    text-align: center;
    padding: 52px 24px 32px;
  }

  .welcome-logo {
    height: 40px;
    margin-bottom: 24px;
    opacity: 0.9;
  }

  .welcome-divider {
    width: 40px;
    height: 3px;
    background: var(--yellow);
    border-radius: 2px;
    margin: 0 auto 20px;
  }

  .welcome h2 {
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 10px;
    letter-spacing: -0.02em;
  }

  .welcome p {
    font-size: 14px;
    line-height: 1.65;
    color: var(--text-muted);
    max-width: 400px;
    margin: 0 auto 28px;
  }

  .suggested {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    max-width: 540px;
    margin: 0 auto;
  }

  .sug-btn {
    background: var(--white);
    border: 1px solid var(--border);
    color: var(--grey-dark);
    font-size: 13px;
    padding: 8px 15px;
    border-radius: 20px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    transition: all 0.15s;
  }

  .sug-btn:hover {
    border-color: var(--yellow);
    background: var(--yellow-light);
    color: var(--yellow-dark);
  }

  .msg-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    animation: fadeUp 0.2s ease;
  }

  .msg-row.user { flex-direction: row-reverse; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
  }

  .avatar.bot {
    background: var(--yellow-light);
    border: 1.5px solid #F0D060;
    overflow: hidden;
    padding: 5px;
  }

  .avatar.bot img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .avatar.user {
    background: var(--grey-dark);
    color: white;
    font-size: 11px;
  }

  .bubble {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.75;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .bubble.bot {
    background: var(--white);
    color: var(--text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    box-shadow: var(--shadow);
  }

  .bubble.user {
    background: var(--grey-dark);
    color: white;
    border-bottom-right-radius: 4px;
  }

  .bubble.out-of-scope {
    background: var(--yellow-light);
    border-color: #F0D060;
    color: var(--grey-dark);
    font-style: italic;
  }

  .typing {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 14px 18px;
  }

  .typing span {
    width: 7px;
    height: 7px;
    background: var(--yellow);
    border-radius: 50%;
    animation: bounce 1.3s infinite;
  }

  .typing span:nth-child(2) { animation-delay: 0.18s; }
  .typing span:nth-child(3) { animation-delay: 0.36s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-7px); opacity: 1; }
  }

  .input-bar {
    position: sticky;
    bottom: 0;
    background: var(--bg);
    padding: 16px 0 28px;
  }

  .input-inner {
    display: flex;
    gap: 10px;
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 10px 10px 16px;
    align-items: flex-end;
    box-shadow: var(--shadow);
    transition: border-color 0.15s;
  }

  .input-inner:focus-within {
    border-color: var(--yellow);
  }

  textarea {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--text);
    background: transparent;
    line-height: 1.5;
    max-height: 120px;
    overflow-y: auto;
  }

  textarea::placeholder { color: var(--text-muted); }

  .send-btn {
    width: 38px;
    height: 38px;
    background: var(--yellow);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, transform 0.1s;
  }

  .send-btn:hover { background: var(--yellow-dark); }
  .send-btn:active { transform: scale(0.95); }
  .send-btn:disabled { background: var(--border); cursor: not-allowed; }

  .send-btn svg { width: 16px; height: 16px; fill: white; }

  .disclaimer {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 8px;
  }

  @media (max-width: 600px) {
    .chat-wrapper { padding: 16px 12px 0; }
    .bubble { max-width: 88%; }
    header { padding: 0 16px; }
  }
</style>
</head>

    const img = document.createElement('img');
    img.src = LOGO_B64;
    img.alt = 'Wahed';
    avatar.appendChild(img);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + (isUser ? 'user' : 'bot');
  if (isOutOfScope) bubble.classList.add('out-of-scope');
  bubble.textContent = text;

  row.appendChild(avatar);
  row.appendChild(bubble);
  area.appendChild(row);
  area.scrollTop = area.scrollHeight;
}

function addTyping() {
  removeWelcome();
  const area = document.getElementById('chatArea');
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  row.id = 'typingRow';

  const avatar = document.createElement('div');
  avatar.className = 'avatar bot';
  const img = document.createElement('img');
  img.src = LOGO_B64;
  img.alt = 'Wahed';
  avatar.appendChild(img);

  const bubble = document.createElement('div');
  bubble.className = 'bubble bot typing';
  bubble.innerHTML = '<span></span><span></span><span></span>';

  row.appendChild(avatar);
  row.appendChild(bubble);
  area.appendChild(row);
  area.scrollTop = area.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typingRow');
  if (t) t.remove();
}

async function sendQuery() {
  if (isLoading) return;
  const input = document.getElementById('queryInput');
  const query = input.value.trim();
  if (!query) return;

  input.value = '';
  input.style.height = 'auto';
  isLoading = true;
  document.getElementById('sendBtn').disabled = true;

  addMessage(query, true, false);
  addTyping();

  try {
    const res = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query })
    });

    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    removeTyping();
    addMessage(data.answer || 'No response received.', false, data.outOfScope === true);

  } catch (err) {
    removeTyping();
    addMessage('Unable to reach the Shariah assistant. Please check your connection and try again.', false, true);
    console.error(err);
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('queryInput').focus();
}
</script>
</body>
